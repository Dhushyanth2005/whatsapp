<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - WhatsApp Web Clone</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-header">
          <div class="auth-header__logo">💬</div>
          <h1 class="auth-header__title">Create Account</h1>
          <p class="auth-header__subtitle">Sign up to start chatting on WhatsApp Web</p>
        </div>

        <form class="auth-form" id="register-form" novalidate>
          <!-- Full Name -->
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              class="form-input"
              placeholder="e.g. Itachi Uchiha"
              required
            />
            <div class="error-message" id="err-fullName"></div>
          </div>

          <!-- Username -->
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="e.g. itachi"
              required
            />
            <div class="error-message" id="err-username"></div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="name@example.com"
              required
            />
            <div class="error-message" id="err-email"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password (min 8 chars)</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
            />
            <div class="error-message" id="err-password"></div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="••••••••"
              required
            />
            <div class="error-message" id="err-confirmPassword"></div>
          </div>

          <button type="submit" class="btn-primary" id="register-btn" disabled>Register</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
